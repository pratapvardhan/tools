<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notepad.local</title>
</head>
<style>
    * {
        outline: none;
        border: none;
        margin: 0px;
        padding: 0px;
        font-family: Courier, monospace;
        box-sizing: border-box;
    }

    body {
        background: #222222;
        color: beige;
    }

    #app {
        display: flex;
        min-height: 100vh;
    }

    #sidebar {
        width: 220px;
        flex-shrink: 0;
        background: #1a1a1a;
        padding: 16px 12px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        position: sticky;
        top: 0;
        height: 100vh;
    }

    #new-doc {
        background: beige;
        color: #222222;
        padding: 8px;
        border-radius: 6px;
        cursor: pointer;
    }

    #doc-list {
        list-style: none;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .doc-item {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        color: beige;
        padding: 8px 10px;
        border-radius: 6px;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .doc-item:hover {
        background: #333333;
    }

    .doc-item.active {
        background: beige;
        color: #222222;
    }

    #main {
        flex: 1;
        min-width: 0;
    }

    #title {
        color: beige;
        text-align: center;
        padding: 1em;
    }

    #doc-bar {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-top: 8px;
    }

    #doc-title {
        width: min(400px, 70%);
        background: #333333;
        color: beige;
        padding: 6px 10px;
        border-radius: 6px;
    }

    #doc-title:focus {
        background: #444444;
    }

    #delete-doc {
        background: rgb(217, 69, 61);
        color: beige;
        padding: 6px 10px;
        border-radius: 6px;
        cursor: pointer;
    }

    #notebook-page {
        width: min(900px, 90%);
        margin: 24px auto 100px auto;
        background-color: beige;
        background-image: linear-gradient(transparent 98%, rgb(0, 166, 255) 98%), linear-gradient(90deg, transparent 95%, rgb(217, 69, 61) 95%);
        background-size: 100% 30px, 0 100%;
        position: relative;
        border-radius: 12px;
    }

    #notebook-page::before {
        content: '';
        position: absolute;
        left: 5em;
        top: 0;
        bottom: 0;
        width: 2px;
        background: rgb(217, 69, 61);
    }

    #text {
        font-size: 18px;
        line-height: 30px;
        background: none;
        padding: 0 3rem 0 6rem;
        width: -webkit-fill-available;
    }

    @media (max-width: 700px) {
        #app {
            flex-direction: column;
        }

        #sidebar {
            width: 100%;
            height: auto;
            max-height: 30vh;
            position: static;
        }
    }
</style>

<body>
    <div id="app">
        <aside id="sidebar">
            <button id="new-doc">+ New</button>
            <ul id="doc-list"></ul>
        </aside>

        <main id="main">
            <div id="title">
                <h3>Notepad.local</h3>
                <span style="font-size: 12px;">[ utilizes local storage, all data remains in your browser. No tracking. ]</span>
                <div id="doc-bar">
                    <input id="doc-title" type="text" placeholder="Title">
                    <button id="delete-doc">Delete</button>
                </div>
            </div>

            <div id="notebook-page">
                <textarea placeholder="Enter something..." id="text" name="text" rows="4"
                    style="word-wrap: break-word; resize: vertical; height: 80vh; " autofocus></textarea>
            </div>
        </main>
    </div>
</body>
<script>
    const STORAGE_KEY = "notepad:v2";
    const LEGACY_KEY = "notepadcontent";

    const list = document.getElementById("doc-list");
    const titleInput = document.getElementById("doc-title");
    const text = document.getElementById("text");

    function newDoc(title, content) {
        return { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title, content };
    }

    function loadState() {
        try {
            const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
            if (saved && saved.docs && saved.docs.length) return saved;
        } catch (e) { }
        let legacy = null;
        try { legacy = localStorage.getItem(LEGACY_KEY); } catch (e) { }
        const doc = newDoc("Untitled", legacy || "");
        return { activeId: doc.id, docs: [doc] };
    }

    function saveState() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { }
    }

    function activeDoc() {
        return state.docs.find(d => d.id === state.activeId) || state.docs[0];
    }

    function renderList() {
        list.innerHTML = "";
        state.docs.forEach(doc => {
            const li = document.createElement("li");
            const button = document.createElement("button");
            button.className = "doc-item" + (doc.id === state.activeId ? " active" : "");
            button.textContent = doc.title || "Untitled";
            button.onclick = () => {
                state.activeId = doc.id;
                saveState();
                render();
            };
            li.appendChild(button);
            list.appendChild(li);
        });
    }

    function render() {
        const doc = activeDoc();
        state.activeId = doc.id;
        titleInput.value = doc.title;
        text.value = doc.content;
        renderList();
    }

    document.getElementById("new-doc").onclick = () => {
        const doc = newDoc("Untitled", "");
        state.docs.push(doc);
        state.activeId = doc.id;
        saveState();
        render();
        titleInput.focus();
        titleInput.select();
    };

    document.getElementById("delete-doc").onclick = () => {
        const doc = activeDoc();
        if (!confirm(`Delete "${doc.title || "Untitled"}"?`)) return;
        const index = state.docs.indexOf(doc);
        state.docs.splice(index, 1);
        if (!state.docs.length) state.docs.push(newDoc("Untitled", ""));
        state.activeId = state.docs[Math.max(0, index - 1)].id;
        saveState();
        render();
    };

    titleInput.oninput = () => {
        activeDoc().title = titleInput.value;
        saveState();
        renderList();
    };

    text.oninput = () => {
        activeDoc().content = text.value;
        saveState();
    };

    const state = loadState();
    render();
</script>

</html>
