<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Canvas.local</title>
    <script>
        // Set the theme before first paint: saved choice, else the system preference.
        (() => {
            let saved = null;
            try { saved = localStorage.getItem("canvas:theme"); } catch (e) { }
            const system = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
            document.documentElement.dataset.theme = saved === "light" || saved === "dark" ? saved : system;
        })();
    </script>
    <style>
        :root {
            --bg: #222222;
            --sidebar: #1a1a1a;
            --panel: #2c2c2c;
            --border: #3a3a3a;
            --hover: #3a3a3a;
            --text: beige;
            --muted: #888888;
            --dots: #444444;
            --accent: #4da3ff;
            --accent-soft: rgba(77, 163, 255, 0.1);
            --active-bg: beige;
            --active-fg: #222222;
            --opt-bg: #353535;
            --danger: rgb(217, 69, 61);
            --shadow: rgba(0, 0, 0, 0.35);
            --swatch-ring: rgba(255, 255, 255, 0.15);
            color-scheme: dark;
        }

        :root[data-theme="light"] {
            --bg: #f8f8f5;
            --sidebar: #ededea;
            --panel: #ffffff;
            --border: #dddddd;
            --hover: #ececec;
            --text: #1e1e1e;
            --muted: #777777;
            --dots: #cccccc;
            --accent: #1c7ed6;
            --accent-soft: rgba(28, 126, 214, 0.1);
            --active-bg: #1e1e1e;
            --active-fg: #ffffff;
            --opt-bg: #f0f0f0;
            --danger: rgb(201, 42, 42);
            --shadow: rgba(0, 0, 0, 0.12);
            --swatch-ring: rgba(0, 0, 0, 0.15);
            color-scheme: light;
        }

        #dots circle {
            fill: var(--dots);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        [hidden] {
            display: none !important;
        }

        body {
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        button {
            border: none;
            outline: none;
            font: inherit;
            color: inherit;
            background: none;
            cursor: pointer;
        }

        #app {
            display: flex;
            height: 100vh;
            height: 100dvh;
        }

        #sidebar {
            width: 200px;
            flex-shrink: 0;
            background: var(--sidebar);
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #new-board {
            background: var(--active-bg);
            color: var(--active-fg);
            padding: 8px;
            border-radius: 6px;
        }

        #board-list {
            list-style: none;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .board-item {
            display: block;
            width: 100%;
            text-align: left;
            padding: 8px 10px;
            border-radius: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .board-item:hover {
            background: var(--hover);
        }

        .board-item.active {
            background: var(--active-bg);
            color: var(--active-fg);
        }

        #theme-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 13px;
        }

        #theme-toggle:hover {
            background: var(--hover);
        }

        #note {
            font-size: 11px;
            color: var(--muted);
        }

        #main {
            flex: 1;
            min-width: 0;
            min-height: 0;
            position: relative;
            overflow: hidden;
        }

        #stage {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .panel {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: 0 4px 16px var(--shadow);
        }

        .panel button {
            min-width: 34px;
            height: 34px;
            padding: 0 8px;
            border-radius: 7px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .panel button:hover {
            background: var(--hover);
        }

        .panel button.active {
            background: var(--active-bg);
            color: var(--active-fg);
        }

        .panel svg,
        #theme-toggle svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .sep {
            width: 1px;
            height: 22px;
            background: var(--border);
            margin: 0 2px;
        }

        #topbar {
            top: 12px;
            left: 12px;
        }

        #board-title {
            width: 180px;
            background: none;
            color: var(--text);
            border: none;
            outline: none;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 14px;
        }

        #board-title:focus {
            background: var(--hover);
        }

        #delete-board {
            color: var(--danger);
            font-size: 13px;
        }

        #toolbar {
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
        }

        #zoombar {
            right: 12px;
            bottom: 12px;
            font-size: 13px;
        }

        #zoom-reset {
            min-width: 56px;
        }

        #stylebar {
            top: 64px;
            left: 12px;
            width: 176px;
            flex-direction: column;
            align-items: stretch;
            gap: 10px;
            padding: 10px;
            max-height: calc(100% - 140px);
            overflow-y: auto;
        }

        #stylebar .row {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        #stylebar .label {
            font-size: 11px;
            color: var(--muted);
        }

        #stylebar .opts {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        #stylebar .opt {
            min-width: 0;
            height: 26px;
            padding: 0 8px;
            font-size: 12px;
            background: var(--opt-bg);
        }

        #stylebar .opt.active {
            background: var(--active-bg);
            color: var(--active-fg);
        }

        #stylebar .swatch {
            min-width: 0;
            width: 20px;
            height: 20px;
            padding: 0;
            border-radius: 5px;
            box-shadow: inset 0 0 0 1px var(--swatch-ring);
        }

        #stylebar .swatch.none {
            background: linear-gradient(to top right, transparent 45%, var(--danger) 45% 55%, transparent 55%), var(--bg);
        }

        #stylebar .swatch.active {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        .bar {
            display: block;
            width: 16px;
            background: currentColor;
            border-radius: 2px;
        }

        #hint {
            position: absolute;
            right: 16px;
            top: 18px;
            font-size: 11px;
            color: var(--muted);
            pointer-events: none;
        }

        #notice {
            color: var(--danger);
            font-size: 12px;
            padding: 0 6px;
        }

        #editor {
            position: absolute;
            background: none;
            border: none;
            outline: 1px dashed var(--accent);
            outline-offset: 2px;
            resize: none;
            overflow: hidden;
            padding: 0;
            color: var(--text);
            line-height: 1.25;
        }

        .sel-box,
        .sel-outline,
        .bind-hint,
        .marquee {
            fill: none;
            stroke: var(--accent);
            stroke-width: 1;
            pointer-events: none;
        }

        .sel-outline {
            stroke-dasharray: 3 3;
        }

        .bind-hint {
            stroke-width: 2;
        }

        .marquee {
            fill: var(--accent-soft);
        }

        .handle {
            fill: var(--bg);
            stroke: var(--accent);
            stroke-width: 1.5;
        }

        #export-menu {
            top: 56px;
            left: 12px;
            z-index: 5;
            min-width: 180px;
            flex-direction: column;
            align-items: stretch;
        }

        #export-menu button {
            justify-content: flex-start;
            font-size: 13px;
        }

        #export-menu button:disabled {
            opacity: 0.4;
            cursor: default;
        }

        #export-menu .label {
            font-size: 11px;
            color: var(--muted);
            padding: 4px 8px 0;
        }

        #export-button,
        #snap-toggle {
            font-size: 13px;
        }

        @media (max-width: 700px) {
            #app {
                flex-direction: column;
            }

            #sidebar {
                width: 100%;
                max-height: 25vh;
            }

            #note,
            #hint {
                display: none;
            }

            #board-title {
                width: 120px;
            }

            #toolbar {
                left: 12px;
                right: 12px;
                transform: none;
                flex-wrap: wrap;
                justify-content: center;
            }

            #zoombar {
                top: 12px;
                bottom: auto;
            }
        }
    </style>
</head>

<body>
    <div id="app">
        <aside id="sidebar">
            <button id="new-board">+ New board</button>
            <ul id="board-list"></ul>
            <button id="theme-toggle" title="Toggle light / dark theme"></button>
            <div id="note">[ saved in IndexedDB, all data remains in your browser. No tracking. ]</div>
        </aside>

        <main id="main">
            <svg id="stage" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <pattern id="dots" patternUnits="userSpaceOnUse" width="24" height="24">
                        <circle cx="1" cy="1" r="1" fill="#444444" />
                    </pattern>
                    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
                        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.35" />
                    </filter>
                </defs>
                <rect width="100%" height="100%" fill="url(#dots)" />
                <g id="world"></g>
                <g id="ui"></g>
            </svg>

            <div id="topbar" class="panel">
                <input id="board-title" type="text" placeholder="Untitled">
                <button id="export-button" title="Export / import">Export</button>
                <button id="delete-board" title="Delete board">Delete</button>
                <span id="notice" hidden></span>
            </div>

            <div id="export-menu" class="panel" hidden>
                <div class="label" id="export-scope"></div>
                <button data-export="png">PNG image</button>
                <button data-export="svg">SVG image</button>
                <button data-export="json">JSON (with images)</button>
                <div class="label">Import</div>
                <button id="import-button">Open JSON as new board…</button>
            </div>

            <div id="stylebar" class="panel" hidden></div>

            <div id="toolbar" class="panel">
                <button data-tool="select" title="Select (V)"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L10 19z" /></svg></button>
                <button data-tool="hand" title="Pan (H, or hold Space)"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3" /></svg></button>
                <span class="sep"></span>
                <button data-tool="rect" title="Rectangle (R)"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2" /></svg></button>
                <button data-tool="ellipse" title="Ellipse (O)"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="6" /></svg></button>
                <button data-tool="arrow" title="Arrow (A)"><svg viewBox="0 0 24 24"><path d="M5 19L19 5M10 5h9v9" /></svg></button>
                <button data-tool="pen" title="Pen (P)"><svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z" /></svg></button>
                <button data-tool="text" title="Text (T)"><svg viewBox="0 0 24 24"><path d="M5 7V4h14v3M12 4v16M9 20h6" /></svg></button>
                <button data-tool="sticky" title="Sticky note (S)"><svg viewBox="0 0 24 24"><path d="M5 4h14v10l-6 6H5zM13 20v-6h6" /></svg></button>
                <button id="image-button" title="Image (I), or paste / drop"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" /><circle cx="9" cy="10" r="2" /><path d="M21 16l-5-5-9 8" /></svg></button>
                <span class="sep"></span>
                <button id="undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3" /></svg></button>
                <button id="redo" title="Redo (Ctrl+Shift+Z)"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M20 9H10a6 6 0 000 12h3" /></svg></button>
            </div>

            <div id="zoombar" class="panel">
                <button id="zoom-out" title="Zoom out (Ctrl -)">−</button>
                <button id="zoom-reset" title="Reset zoom (Ctrl 0)">100%</button>
                <button id="zoom-in" title="Zoom in (Ctrl +)">+</button>
                <button id="zoom-fit" title="Zoom to fit (Shift 1)">Fit</button>
                <span class="sep"></span>
                <button id="snap-toggle" title="Snap to grid (G)">Snap</button>
            </div>

            <div id="hint">Scroll to pan · Ctrl+scroll to zoom · Double-click to add text · Paste or drop images</div>

            <textarea id="editor" hidden spellcheck="false"></textarea>
            <input id="image-input" type="file" accept="image/*" multiple hidden>
            <input id="import-input" type="file" accept=".json,application/json" hidden>
        </main>
    </div>

    <script>
        const DB_NAME = "canvas-local";
        const FONT = 'system-ui, -apple-system, "Segoe UI", sans-serif';
        const LINE = 1.25;
        const NOTE_INK = "#222222";
        const MIN_SCALE = 0.1, MAX_SCALE = 8;
        const MAX_IMAGE = 2048;
        // Handle positions as fractions of the selection box.
        const HANDLES = { nw: [0, 0], n: [0.5, 0], ne: [1, 0], e: [1, 0.5], se: [1, 1], s: [0.5, 1], sw: [0, 1], w: [0, 0.5] };
        const HANDLE_CURSORS = { nw: "nwse-resize", se: "nwse-resize", ne: "nesw-resize", sw: "nesw-resize", n: "ns-resize", s: "ns-resize", e: "ew-resize", w: "ew-resize" };
        const SVG_NS = "http://www.w3.org/2000/svg";
        const DRAW_TOOLS = new Set(["rect", "ellipse", "arrow", "pen", "text", "sticky"]);
        const BINDABLE = new Set(["rect", "ellipse", "text", "sticky", "image"]);
        const CONTAINERS = new Set(["rect", "ellipse", "sticky"]);
        const UNIFORM = new Set(["text", "image"]);
        const EDITABLE = new Set(["text", ...CONTAINERS]);
        const TYPES = new Set([...BINDABLE, "arrow", "pen"]);
        const TOOL_KEYS = { v: "select", h: "hand", r: "rect", o: "ellipse", a: "arrow", p: "pen", t: "text", s: "sticky" };
        const NUDGE_KEYS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
        const GRID = 24;
        const CLIP_TYPE = "canvas-local/elements";
        const COARSE = matchMedia("(pointer: coarse)").matches;
        const HANDLE = COARSE ? 14 : 8;

        const STROKES = ["#f5f5dc", "#9e9e9e", "#ff6b6b", "#ffa94d", "#ffd43b", "#69db7c", "#4dabf7", "#b197fc"];
        const STICKIES = ["#fff3a0", "#ffc9de", "#c3f0ca", "#c5e3ff", "#e0d4ff", "#ffd8a8"];
        // Stored colours are the dark-theme palette; the light theme draws a deeper shade of each.
        const LIGHT_STROKES = ["#1e1e1e", "#868e96", "#e03131", "#e8590c", "#f08c00", "#2f9e44", "#1971c2", "#7048e8"];
        const LIGHT_INK = new Map([["beige", LIGHT_STROKES[0]], ...STROKES.map((c, i) => [c, LIGHT_STROKES[i]])]);
        const CANVAS_THEME = { dark: { bg: "#222222", placeholder: "#2c2c2c" }, light: { bg: "#f8f8f5", placeholder: "#e5e5e5" } };
        const theme = () => document.documentElement.dataset.theme;

        function themed(c) {
            if (!c || c === "none" || theme() !== "light") return c;
            // Fills carry an alpha suffix (#rrggbbaa).
            const base = c.length === 9 ? c.slice(0, 7) : c;
            const mapped = LIGHT_INK.get(base.toLowerCase());
            return mapped ? mapped + c.slice(base.length) : c;
        }
        const STYLE_OPTIONS = {
            stroke: { label: "Colour", types: ["rect", "ellipse", "arrow", "pen", "text"], options: STROKES.map(c => ({ value: c, swatch: c })) },
            fill: { label: "Fill", types: ["rect", "ellipse"], options: ["none", ...STROKES.map(c => c + "4d")].map(c => ({ value: c, swatch: c })) },
            sticky: { label: "Note", types: ["sticky"], options: STICKIES.map(c => ({ value: c, swatch: c })) },
            strokeWidth: { label: "Width", types: ["rect", "ellipse", "arrow", "pen"], options: [1, 2, 4].map(v => ({ value: v, html: `<span class="bar" style="height:${v}px"></span>` })) },
            dash: { label: "Line", types: ["rect", "ellipse", "arrow"], options: [{ value: false, html: "Solid" }, { value: true, html: "Dashed" }] },
            fontSize: { label: "Text size", types: ["text", "sticky", "rect", "ellipse"], options: [[16, "S"], [20, "M"], [28, "L"], [40, "XL"]].map(([v, l]) => ({ value: v, html: l })) },
        };
        // Defaults for new elements; picking a style also updates these.
        const style = { stroke: STROKES[0], fill: "none", sticky: STICKIES[0], strokeWidth: 2, dash: false, fontSize: 20 };

        const stage = document.getElementById("stage");
        const world = document.getElementById("world");
        const ui = document.getElementById("ui");
        const dots = document.getElementById("dots");
        const editor = document.getElementById("editor");
        const boardList = document.getElementById("board-list");
        const titleInput = document.getElementById("board-title");
        const zoomLabel = document.getElementById("zoom-reset");
        const notice = document.getElementById("notice");
        const stylebar = document.getElementById("stylebar");
        const imageInput = document.getElementById("image-input");

        let db = null;
        let boards = [];
        let board = null;
        let selected = new Set();
        let tool = "select";
        let drag = null;
        let editing = null;
        let spaceDown = false;
        let undoStack = [], redoStack = [];
        let lastNudge = 0;
        let lastPointer = null;
        let snapOn = pref("snap") === "1";
        // Active touch pointers, for pinch zoom and double-tap.
        const touches = new Map();
        let tapStart = null, lastTap = null, lastTouchEnd = 0;

        // ---------- storage ----------

        function openDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, 2);
                req.onupgradeneeded = () => {
                    const d = req.result;
                    if (!d.objectStoreNames.contains("boards")) d.createObjectStore("boards", { keyPath: "id" });
                    if (!d.objectStoreNames.contains("meta")) d.createObjectStore("meta");
                    if (!d.objectStoreNames.contains("files")) d.createObjectStore("files", { keyPath: "id" });
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        function tx(storeName, mode, fn) {
            return new Promise((resolve, reject) => {
                const t = db.transaction(storeName, mode);
                const req = fn(t.objectStore(storeName));
                t.oncomplete = () => resolve(req && req.result);
                t.onerror = t.onabort = () => reject(t.error);
            });
        }

        let saveTimer = null, dirty = false;

        function scheduleSave() {
            dirty = true;
            clearTimeout(saveTimer);
            saveTimer = setTimeout(flushSave, 300);
        }

        function flushSave() {
            clearTimeout(saveTimer);
            if (!dirty || !board) return;
            dirty = false;
            saveBoard(board);
        }

        // IndexedDB clones the value on put, so no copy is needed.
        function saveBoard(b) {
            b.updated = Date.now();
            if (db) tx("boards", "readwrite", s => s.put(b)).catch(() => showNotice("Save failed"));
        }

        function showNotice(msg) {
            notice.textContent = msg;
            notice.hidden = false;
        }

        // Per-browser preferences; storage can be unavailable (private mode, blocked site data).
        function pref(key, value) {
            try {
                if (value === undefined) return localStorage.getItem("canvas:" + key);
                localStorage.setItem("canvas:" + key, value);
            } catch (e) {
                return null;
            }
        }

        // Image blobs live in their own store, so board JSON and undo snapshots stay small.
        const fileURLs = new Map(), fileLoads = new Map();

        function storeFile(blob) {
            const id = uid();
            fileURLs.set(id, URL.createObjectURL(blob));
            if (db) tx("files", "readwrite", s => s.put({ id, blob, created: Date.now() })).catch(() => showNotice("Image save failed"));
            return id;
        }

        function fileURL(id) {
            if (fileURLs.has(id)) return fileURLs.get(id);
            if (db && !fileLoads.has(id)) {
                fileLoads.set(id, tx("files", "readonly", s => s.get(id)).then(rec => {
                    if (!rec) return;
                    fileURLs.set(id, URL.createObjectURL(rec.blob));
                    renderElements();
                }).catch(() => { }));
            }
            return null;
        }

        // ---------- model ----------

        function uid() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        }

        function newBoard() {
            const now = Date.now();
            return { id: uid(), title: "Untitled", created: now, updated: now, viewport: { x: 0, y: 0, scale: 1 }, elements: [] };
        }

        const isNum = n => typeof n === "number" && Number.isFinite(n);

        // Drop malformed elements from stored or outside data (import, paste) and fill in missing fields,
        // so a bad file can't break rendering.
        function sanitize(els) {
            return (Array.isArray(els) ? els : []).filter(el => {
                if (!el || typeof el.id !== "string" || !TYPES.has(el.type)) return false;
                if (el.type === "arrow" || el.type === "pen") {
                    if (!Array.isArray(el.points) || el.points.length < (el.type === "arrow" ? 2 : 1)) return false;
                    if (!el.points.every(q => q && isNum(q.x) && isNum(q.y))) return false;
                    fitPoints(el);
                } else if (![el.x, el.y, el.w, el.h].every(isNum)) return false;
                if (EDITABLE.has(el.type)) {
                    if (typeof el.text !== "string") el.text = "";
                    if (!isNum(el.fontSize)) el.fontSize = 20;
                }
                if (el.type === "text") el.color ??= STROKES[0];
                else if (el.type === "sticky") el.fill ??= STICKIES[0];
                else if (el.type !== "image") {
                    el.stroke ??= STROKES[0];
                    if (!isNum(el.strokeWidth)) el.strokeWidth = 2;
                    el.dash ??= false;
                    if (el.type !== "arrow" && el.type !== "pen") el.fill ??= "none";
                }
                return true;
            });
        }

        function selectedEls() {

        function byId(id) {

        function bounds(els) {

        const measureCtx = document.createElement("canvas").getContext("2d");
        // Baseline offset (in em) of the first line inside a line box of LINE em, so SVG text matches the textarea.

        function fitText(el) {

        function wrapText(text, maxW, fontSize) {

        const wrapCache = new WeakMap();

        // Where and how an element's text is drawn. Free text is unwrapped; containers wrap inside a padded box.
        function textLayout(el) {

        // Grow a container's height so its text fits.
        function growToFit(el) {
            if (!CONTAINERS.has(el.type)) return;

            if (el.h < need) el.h = need;

        function edgePoint(el, toward) {
            const c = center(el), dx = toward.x - c.x, dy = toward.y - c.y, gap = 6;
            const len = Math.hypot(dx, dy);

            const t = el.type === "ellipse"

            if (t >= 1) return c;

        // Snap bound arrow ends to the edge of their shapes, pointing at the other end.
        function layoutArrows() {
            const ids = new Map(board.elements.map(el => [el.id, el]));
            board.elements.forEach(el => {
                if (el.type !== "arrow") return;
                const a = el.start && ids.get(el.start.id), b = el.end && ids.get(el.end.id);
                if (el.start && !a) el.start = null;
                if (el.end && !b) el.end = null;

        function topmost(test) {

        // Inside el's shape grown by pad (shrunk, when pad is negative).

            if (el.end && !selected.has(el.end.id)) el.end = null;
        }

        // ---------- history ----------

        function snapshot() {

        function setElements(json) {

            scheduleSave();

        // ---------- coordinates ----------

        function toWorld(e) {

        function toScreenBox(b) {
            const v = board.viewport;
            return { x: b.x * v.scale + v.x, y: b.y * v.scale + v.y, w: b.w * v.scale, h: b.h * v.scale };
        }

        const zoomBy = k => zoomAt(stageCenter(), board.viewport.scale * k);

        function zoomAt(pt, scale) {
            const v = board.viewport;

        }

            const v = board.viewport;

        function renderLabel(t, el) {

                if (!seen.has(id)) { node.remove(); nodes.delete(id); }
            }
        }

        function renderUI() {
            ui.replaceChildren();
            const els = selectedEls();
            const v = board.viewport;
            if (els.length && !editing) {

                if (single && single.type === "arrow") {

                        const h = svgEl("circle", { cx: q.x * v.scale + v.x, cy: q.y * v.scale + v.y, r: HANDLE / 2 + 1, class: "handle" });

            }

        }

        function renderViewport() {
            const v = board.viewport;
            world.setAttribute("transform", `translate(${v.x} ${v.y}) scale(${v.scale})`);
            let gap = 24 * v.scale;
            while (gap < 12) gap *= 2;
            while (gap > 48) gap /= 2;

        }

        function renderAll() {
            renderElements();
            renderViewport();
        }

        function renderBoardList() {
            boardList.replaceChildren(...boards.map(b => {
                const li = document.createElement("li");
                const button = document.createElement("button");
                button.className = "board-item" + (b === board ? " active" : "");

        // ---------- style panel ----------

        function addRow(label) {

        function addButton(row, className, html, onclick) {

            b.className = className;
            b.innerHTML = html;
            b.onclick = onclick;
            row.lastChild.append(b);
            return b;
        }

        const styleRows = {};
        for (const key in STYLE_OPTIONS) {

                b.dataset.value = JSON.stringify(opt.value);
                if (opt.swatch) {
                    b.dataset.swatch = opt.swatch;
                    b.title = none ? "No fill" : opt.swatch;
                }

        }

        // ---------- layers ----------

        const LAYER_ACTIONS = [
            ["back", "Send to back (Shift+Ctrl+[)", "M12 4v12M7 11l5 5 5-5M5 20h14"],
            ["backward", "Send backward (Ctrl+[)", "M12 5v14M7 14l5 5 5-5"],
            ["forward", "Bring forward (Ctrl+])", "M12 19V5M7 10l5-5 5 5"],
            ["front", "Bring to front (Shift+Ctrl+])", "M12 20V8M7 13l5-5 5 5M5 4h14"],

        const layerRow = addRow("Layer");
        LAYER_ACTIONS.forEach(([kind, title, d]) => {

        function overlaps(a, b) {

        }

        // Front/back move the whole selection to the end of the stack. Forward/backward move

        function reorder(kind) {
            const els = board.elements, isSel = el => selected.has(el.id);
            let next;
            if (kind === "front") next = [...els.filter(el => !isSel(el)), ...els.filter(isSel)];
            else if (kind === "back") next = [...els.filter(isSel), ...els.filter(el => !isSel(el))];
            else {
                next = els.slice();
                const up = kind === "forward";
                // Walk from the far end so moved elements don't get moved twice.
                const order = next.filter(isSel);
                if (up) order.reverse();
                for (const el of order) {
                    const i = next.indexOf(el);
                    const passes = (o, k) => (up ? k > i : k < i) && !isSel(o) && overlaps(el, o);
                    const j = up ? next.findIndex(passes) : next.findLastIndex(passes);
                    if (j < 0) continue;
                    next.splice(i, 1);
                    next.splice(j, 0, el);
                }
            }
            if (next.every((el, i) => el === els[i])) return;
            const before = snapshot();
            board.elements = next;
            commit(before);
        }

        // Element property a style key maps to, or null if it doesn't apply.
        function styleProp(key, el) {
            if (!STYLE_OPTIONS[key].types.includes(el.type)) return null;
            if (key === "stroke" && el.type === "text") return "color";
            if (key === "sticky") return "fill";
            return key;
        }

        function currentStyle(key) {
            for (const el of selectedEls()) {
                const prop = styleProp(key, el);
                if (prop) return el[prop] ?? style[key];
            }
            return style[key];
        }

        function renderStyleBar() {
            const els = selectedEls();
            const types = new Set(els.length ? els.map(el => el.type) : DRAW_TOOLS.has(tool) ? [tool] : []);
            let any = false;
            for (const key in STYLE_OPTIONS) {
                const show = STYLE_OPTIONS[key].types.some(t => types.has(t));
                styleRows[key].hidden = !show;
                any = any || show;
                if (!show) continue;
                const value = JSON.stringify(currentStyle(key));
                styleRows[key].querySelectorAll("button").forEach(b => {
                    b.classList.toggle("active", b.dataset.value === value);
                    if (b.dataset.swatch && b.dataset.swatch !== "none") b.style.background = themed(b.dataset.swatch);
                });
            }
            layerRow.hidden = !els.length;
            stylebar.hidden = !any && !els.length;
        }

        function applyStyle(key, value) {
            style[key] = value;
            const els = selectedEls().filter(el => styleProp(key, el));
            if (!els.length) return renderUI();
            const before = snapshot();
            els.forEach(el => {
                el[styleProp(key, el)] = value;
                if (key === "fontSize") el.type === "text" ? fitText(el) : growToFit(el);
            });
            commit(before);
        }

        // ---------- tools ----------

        function setTool(name) {
            tool = name;
            document.querySelectorAll("[data-tool]").forEach(b => b.classList.toggle("active", b.dataset.tool === name));
            updateCursor();
            renderUI();
        }

        function updateCursor(cursor) {
            if (drag && drag.mode === "pan") cursor = "grabbing";
            else if (spaceDown || tool === "hand") cursor = "grab";
            else if (tool === "text") cursor = "text";
            else if (DRAW_TOOLS.has(tool)) cursor = "crosshair";
            stage.style.cursor = cursor || "default";
        }

        function newShape(type, p) {
            const base = { id: uid(), type, x: p.x, y: p.y, w: 0, h: 0 };
            const line = { stroke: style.stroke, strokeWidth: style.strokeWidth };
            if (type === "sticky") return { ...base, fill: style.sticky, text: "", fontSize: style.fontSize };
            if (type === "pen") return { ...base, ...line, points: [{ ...p }] };
            if (type === "arrow") return { ...base, ...line, dash: style.dash, points: [{ ...p }, { ...p }], start: null, end: null };
            return { ...base, ...line, fill: style.fill, dash: style.dash, text: "", fontSize: style.fontSize };
        }

        // Add a new element and start the drag that shapes it.
        function beginCreate(el, props) {
            const before = snapshot();
            board.elements.push(el);
            selected = new Set(el.type === "pen" ? [] : [el.id]);
            drag = { creating: true, el, before, ...props };
            renderAll();
        }

        function createText(p, text = "") {
            const before = snapshot();
            const fontSize = style.fontSize;
            const el = { id: uid(), type: "text", x: p.x, y: p.y - (fontSize * LINE) / 2, w: 0, h: 0, text, fontSize, color: style.stroke };
            fitText(el);
            board.elements.push(el);
            if (text) commit(before, [el.id]);
            else startEdit(el, true, before);
        }

        function startEdit(el, isNew, before) {
            editing = { el, isNew, before: before || snapshot(), original: el.text };
            selected = new Set([el.id]);
            editor.value = el.text;
            editor.hidden = false;
            renderAll();
            // Defer focus: the pointerdown that started this would otherwise blur the editor right away.
            setTimeout(() => editor.focus(), 0);
        }

        function positionEditor() {
            const el = editing.el, v = board.viewport, L = textLayout(el);
            let box;
            if (el.type === "text") {
                box = toScreenBox(el);
                box.w += el.fontSize * v.scale;
            } else {
                const th = Math.max(1, L.lines.length) * el.fontSize * LINE;
                const left = L.anchor === "middle" ? el.x + el.w / 2 - L.maxW / 2 : L.x;
                const top = el.type === "sticky" ? L.y : el.y + (el.h - th) / 2;
                box = toScreenBox({ x: left, y: top, w: L.maxW, h: th });
            }
            Object.assign(editor.style, {
                left: box.x + "px",
                top: box.y + "px",
                width: box.w + "px",
                height: box.h + "px",
                fontSize: el.fontSize * v.scale + "px",
                fontFamily: FONT,
                color: L.color,
                caretColor: L.color,
                textAlign: L.anchor === "middle" ? "center" : "left",
                whiteSpace: el.type === "text" ? "pre" : "pre-wrap",
                overflowWrap: "anywhere",
            });
        }

        function commitEdit() {
            if (!editing) return;
            const { el, isNew, before, original } = editing;
            editing = null;
            editor.hidden = true;
            el.text = editor.value;
            if (el.type === "text" && !el.text.trim()) {
                board.elements = board.elements.filter(e => e !== el);
                selected.delete(el.id);
            } else if (el.type === "text") {
                fitText(el);
            } else {
                growToFit(el);
            }
            const changed = isNew ? !!el.text.trim() : el.text !== original;
            if (changed) pushUndo(before);
            renderAll();
            scheduleSave();
        }

        editor.addEventListener("input", () => {
            const el = editing.el;
            el.text = editor.value;
            if (el.type === "text") fitText(el);
            else growToFit(el);
            renderElements();
            positionEditor();
        });
        editor.addEventListener("blur", commitEdit);
        editor.addEventListener("keydown", e => {
            if (e.key === "Escape" || (e.key === "Enter" && (e.metaKey || e.ctrlKey))) {
                e.preventDefault();
                editor.blur();
            }
        });

        function deleteSelected() {
            if (!selected.size) return;
            const before = snapshot();
            board.elements = board.elements.filter(el => !selected.has(el.id));
            commit(before, []);
        }

        function nudge(dx, dy) {
            if (!selected.size) return;
            if (Date.now() - lastNudge > 500) pushUndo(snapshot());
            lastNudge = Date.now();
            selectedEls().forEach(el => translateEl(el, structuredClone(el), dx, dy));
            renderAll();
            scheduleSave();
        }

        // ---------- images ----------

        function loadImage(url) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = url;
            });
        }

        // Downscale large images so IndexedDB stays small.
        async function prepareImage(file) {
            const url = URL.createObjectURL(file);
            try {
                const img = await loadImage(url);
                let w = img.naturalWidth || 300, h = img.naturalHeight || 200;
                if (file.type === "image/svg+xml" || Math.max(w, h) <= MAX_IMAGE) return { blob: file, w, h };
                const k = MAX_IMAGE / Math.max(w, h);
                w = Math.round(w * k);
                h = Math.round(h * k);
                const canvas = document.createElement("canvas");
                canvas.width = w;
                canvas.height = h;
                canvas.getContext("2d").drawImage(img, 0, 0, w, h);
                const type = file.type === "image/jpeg" ? "image/jpeg" : "image/png";
                const blob = await new Promise(r => canvas.toBlob(r, type, 0.9));
                return { blob, w, h };
            } finally {
                URL.revokeObjectURL(url);
            }
        }

        async function addImages(files, at) {
            files = [...files].filter(f => f.type.startsWith("image/"));
            if (!files.length) return;
            const target = board, before = snapshot(), added = [];
            for (const file of files) {
                let prepared;
                try { prepared = await prepareImage(file); } catch (e) { continue; }
                // Natural size, capped to half the visible area.
                const v = target.viewport;
                const k = Math.min(1, stage.clientWidth * 0.5 / v.scale / prepared.w, stage.clientHeight * 0.5 / v.scale / prepared.h);
                const w = prepared.w * k, h = prepared.h * k, offset = added.length * GRID;
                const el = { id: uid(), type: "image", fileId: storeFile(prepared.blob), x: at.x - w / 2 + offset, y: at.y - h / 2 + offset, w, h };
                target.elements.push(el);
                added.push(el.id);
            }
            if (!added.length) return;
            // The user switched boards while images were loading: save them where they landed.
            if (target !== board) return saveBoard(target);
            setTool("select");
            commit(before, added);
        }

        document.getElementById("image-button").onclick = () => imageInput.click();
        imageInput.onchange = () => {
            addImages(imageInput.files, worldCenter());
            imageInput.value = "";
        };

        function isTyping(e) {
            return e.target instanceof Element && !!e.target.closest("input, textarea");
        }

        const main = document.getElementById("main");
        main.addEventListener("dragover", e => e.preventDefault());
        main.addEventListener("drop", e => {
            e.preventDefault();
            const files = [...e.dataTransfer.files];
            files.filter(isJSONFile).forEach(importJSON);
            addImages(files, toWorld(e));
        });

        document.addEventListener("paste", e => {
            if (isTyping(e)) return;
            const at = lastPointer ? toWorld(lastPointer) : worldCenter();
            const files = [...e.clipboardData.files];
            if (files.length) {
                e.preventDefault();
                addImages(files, at);
                return;
            }
            const text = e.clipboardData.getData("text/plain");
            const copied = parseClip(text);
            if (copied) {
                e.preventDefault();
                pasteEls(copied, at);
            } else if (text.trim()) {
                e.preventDefault();
                createText(at, text.replace(/\r\n?/g, "\n"));
            }
        });

        // ---------- copy / paste / duplicate ----------

        // Deep copies offset by dx/dy, with new ids unless keepIds. Arrow bindings survive only within the set.
        function cloneEls(els, dx = 0, dy = 0, keepIds = false) {
            const ids = new Map(els.map(el => [el.id, keepIds ? el.id : uid()]));
            const remap = end => end && ids.has(end.id) ? { id: ids.get(end.id) } : null;
            return els.map(el => {
                const c = structuredClone(el);
                c.id = ids.get(el.id);
                if (c.type === "arrow") {
                    c.start = remap(c.start);
                    c.end = remap(c.end);
                }
                if (c.points) {
                    c.points = c.points.map(q => ({ x: q.x + dx, y: q.y + dy }));
                    fitPoints(c);
                } else {
                    c.x += dx;
                    c.y += dy;
                }
                return c;
            });
        }

        function insertEls(els) {
            if (!els.length) return;
            const before = snapshot();
            board.elements.push(...els);
            setTool("select");
            commit(before, els.map(el => el.id));
        }

        function duplicateSelected() {
            insertEls(cloneEls(selectedEls(), GRID, GRID));
        }

        function parseClip(text) {
            if (!text.startsWith("{")) return null;
            try {
                const data = JSON.parse(text);
                return data && data.type === CLIP_TYPE ? data.elements : null;
            } catch (e) {
                return null;
            }
        }

        function pasteEls(els, at) {
            els = sanitize(els);
            if (!els.length) return;
            const b = bounds(els);
            insertEls(cloneEls(els, at.x - (b.x + b.w / 2), at.y - (b.y + b.h / 2)));
        }

        function copySelection(e) {
            if (isTyping(e) || !selected.size) return false;
            e.preventDefault();
            e.clipboardData.setData("text/plain", JSON.stringify({ type: CLIP_TYPE, elements: cloneEls(selectedEls(), 0, 0, true) }));
            return true;
        }

        document.addEventListener("copy", copySelection);
        document.addEventListener("cut", e => { if (copySelection(e)) deleteSelected(); });

        // ---------- snapping ----------

        const snapButton = document.getElementById("snap-toggle");
        const snapV = n => Math.round(n / GRID) * GRID;
        const snapPt = p => snapOn ? { x: snapV(p.x), y: snapV(p.y) } : p;

        function toggleSnap() {
            snapOn = !snapOn;
            pref("snap", snapOn ? "1" : "0");
            snapButton.classList.toggle("active", snapOn);
        }

        snapButton.onclick = toggleSnap;
        snapButton.classList.toggle("active", snapOn);

        // ---------- theme ----------

        const themeButton = document.getElementById("theme-toggle");
        const SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>';
        const MOON = '<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" /></svg>';

        function applyTheme(name, save) {
            document.documentElement.dataset.theme = name;
            if (save) pref("theme", name);
            // The button offers the theme a click switches to.
            themeButton.innerHTML = name === "dark" ? SUN + "Light theme" : MOON + "Dark theme";
            if (board) renderAll();
        }

        themeButton.onclick = () => applyTheme(theme() === "dark" ? "light" : "dark", true);
        applyTheme(theme(), false);
        // Follow the system until the user picks a theme.
        matchMedia("(prefers-color-scheme: light)").addEventListener("change", e => {
            if (!pref("theme")) applyTheme(e.matches ? "light" : "dark", false);
        });

        // ---------- export / import ----------

        const exportMenu = document.getElementById("export-menu");
        const importInput = document.getElementById("import-input");

        function exportEls() {
            return selected.size ? selectedEls() : board.elements;
        }

        function fileName(ext) {
            const base = (board.title || "").replace(/[^\w\- ]+/g, "").trim() || "canvas";
            return `${base}.${ext}`;
        }

        function download(blob, name) {
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = name;
            a.click();
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        }

        function blobToDataURL(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        async function fileDataURL(id) {
            let blob = null;
            if (fileURLs.has(id)) blob = await (await fetch(fileURLs.get(id))).blob();
            else if (db) blob = ((await tx("files", "readonly", s => s.get(id))) || {}).blob;
            return blob ? blobToDataURL(blob) : null;
        }

        // Standalone SVG of els, cloned from the live nodes, with images inlined.
        async function buildSVG(els) {
            const ids = new Set(els.map(el => el.id));
            const b = bounds(els), pad = 32;
            const w = Math.ceil(b.w + 2 * pad), h = Math.ceil(b.h + 2 * pad);
            const svg = svgEl("svg", { xmlns: SVG_NS, width: w, height: h, viewBox: `${b.x - pad} ${b.y - pad} ${w} ${h}` });
            const defs = svgEl("defs");
            defs.append(document.getElementById("shadow").cloneNode(true));
            svg.append(defs, svgEl("rect", { x: b.x - pad, y: b.y - pad, width: w, height: h, fill: CANVAS_THEME[theme()].bg }));
            for (const el of board.elements) {
                if (!ids.has(el.id)) continue;
                const node = nodes.get(el.id).cloneNode(true);
                if (el.type === "image") {
                    const url = await fileDataURL(el.fileId);
                    const img = node.querySelector("image");
                    if (url) img.setAttribute("href", url);
                    else img.remove();
                }
                svg.append(node);
            }
            return { svg: new XMLSerializer().serializeToString(svg), w, h };
        }

        async function exportAs(kind) {
            exportMenu.hidden = true;
            const els = exportEls();
            if (!els.length) return;
            commitEdit();
            if (kind === "json") {
                const elements = cloneEls(els, 0, 0, true), files = {};
                for (const el of elements) {
                    if (el.type === "image" && !files[el.fileId]) files[el.fileId] = await fileDataURL(el.fileId);
                }
                const data = { type: "canvas-local", version: 1, title: board.title, viewport: board.viewport, elements, files };
                download(new Blob([JSON.stringify(data)], { type: "application/json" }), fileName("json"));
                return;
            }
            const { svg, w, h } = await buildSVG(els);
            if (kind === "svg") {
                download(new Blob([svg], { type: "image/svg+xml" }), fileName("svg"));
                return;
            }
            const img = await loadImage("data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg));
            const k = Math.min(2, 8192 / Math.max(w, h));
            const canvas = document.createElement("canvas");
            canvas.width = Math.round(w * k);
            canvas.height = Math.round(h * k);
            canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(blob => blob && download(blob, fileName("png")), "image/png");
        }

        function isJSONFile(f) {
            return f.type === "application/json" || /\.json$/i.test(f.name);
        }

        async function importJSON(file) {
            let data;
            try { data = JSON.parse(await file.text()); } catch (e) { data = null; }
            if (!data || data.type !== "canvas-local" || !Array.isArray(data.elements)) {
                alert(`${file.name} is not a Canvas.local file.`);
                return;
            }
            // Store images under fresh ids so they never clash with existing files.
            const fileIds = new Map();
            for (const [oldId, url] of Object.entries(data.files || {})) {
                if (typeof url === "string" && url.startsWith("data:image/")) fileIds.set(oldId, storeFile(await (await fetch(url)).blob()));
            }
            const b = newBoard(), v = data.viewport;
            b.title = typeof data.title === "string" ? data.title : file.name.replace(/\.json$/i, "");
            if (v && isNum(v.x) && isNum(v.y) && isNum(v.scale) && v.scale > 0) b.viewport = { x: v.x, y: v.y, scale: v.scale };
            b.elements = sanitize(data.elements);
            b.elements.forEach(el => { if (el.type === "image") el.fileId = fileIds.get(el.fileId) || el.fileId; });
            addBoard(b);
        }

        document.getElementById("export-button").onclick = () => {
            exportMenu.hidden = !exportMenu.hidden;
            const n = exportEls().length;
            document.getElementById("export-scope").textContent = selected.size ? `Export selection (${n})` : "Export board";
            exportMenu.querySelectorAll("[data-export]").forEach(b => b.disabled = !n);
        };
        exportMenu.querySelectorAll("[data-export]").forEach(b => b.onclick = () => exportAs(b.dataset.export));
        document.getElementById("import-button").onclick = () => {
            exportMenu.hidden = true;
            importInput.click();
        };
        importInput.onchange = () => {
            [...importInput.files].forEach(importJSON);
            importInput.value = "";
        };
        document.addEventListener("pointerdown", e => {
            if (!exportMenu.hidden && !e.target.closest("#export-menu, #export-button")) exportMenu.hidden = true;
        });

        // ---------- pointer interaction ----------

        function marqueeBox() {
            const a = drag.start, b = drag.cur;
            return { x: Math.min(a.x, b.x), y: Math.min(a.y, b.y), w: Math.abs(a.x - b.x), h: Math.abs(a.y - b.y) };
        }

        // Copies of els as they were when a drag started, by id.
        const originals = els => new Map(els.map(el => [el.id, structuredClone(el)]));

        // `before` is passed when the move starts from a fresh alt-drag duplicate.
        function startMove(p, before) {
            const els = selectedEls();
            drag = { mode: "move", start: p, box: bounds(els), orig: originals(els), before: before || snapshot(), changed: !!before };
        }

        function startResize(name, p) {
            const els = selectedEls();
            if (name[0] === "p") {
                const i = +name[1];
                drag = { mode: "endpoint", el: els[0], i, start: p, orig: { ...els[0].points[i] }, before: snapshot(), changed: false };
                return;
            }
            drag = {
                mode: "resize", handle: HANDLES[name], box: bounds(els), start: p,
                orig: originals(els),
                uniform: els.length === 1 && UNIFORM.has(els[0].type),
                before: snapshot(), changed: false,
            };
        }

        stage.addEventListener("pointerdown", e => {
            if (e.button === 2) return;
            if (e.pointerType === "touch") {
                touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
                if (touches.size === 1) tapStart = { x: e.clientX, y: e.clientY };
                if (touches.size >= 2) {
                    if (touches.size === 2) startPinch();
                    return;
                }
            }
            if (drag && touches.size) return;
            commitEdit();
            stage.setPointerCapture(e.pointerId);
            const p = toWorld(e), v = board.viewport;

            if (e.button === 1 || spaceDown || tool === "hand") {
                drag = { mode: "pan", cx: e.clientX, cy: e.clientY, vx: v.x, vy: v.y };
                updateCursor();
                return;
            }
            if (CONTAINERS.has(tool)) {
                const s = snapPt(p);
                return beginCreate(newShape(tool, s), { mode: "create", start: s });
            }
            if (tool === "arrow") {
                const from = bindTarget(p), el = newShape("arrow", from ? p : snapPt(p));
                if (from) el.start = { id: from.id };
                return beginCreate(el, { mode: "arrow", cx: e.clientX, cy: e.clientY, far: 0 });
            }
            if (tool === "pen") return beginCreate(newShape("pen", p), { mode: "pen" });
            if (tool === "text") {
                const hit = hitTest(p);
                setTool("select");
                if (hit && hit.type === "text") startEdit(hit, false);
                else createText(p);
                return;
            }

            const handle = e.target.closest && e.target.closest("[data-h]");
            if (handle) {
                startResize(handle.dataset.h, p);
                return;
            }
            const hit = hitTest(p);
            if (hit) {
                if (e.shiftKey && selected.has(hit.id)) {
                    selected.delete(hit.id);
                    renderUI();
                    return;
                }
                if (e.shiftKey) selected.add(hit.id);
                else if (!selected.has(hit.id)) selected = new Set([hit.id]);
                if (e.altKey) {
                    const before = snapshot();
                    const copies = cloneEls(selectedEls(), 0, 0);
                    board.elements.push(...copies);
                    selected = new Set(copies.map(el => el.id));
                    startMove(p, before);
                    renderElements();
                } else {
                    startMove(p);
                }
            } else if (selected.size && !e.shiftKey && inside(p, bounds(selectedEls()))) {
                startMove(p);
            } else {
                const base = e.shiftKey ? new Set(selected) : new Set();
                drag = { mode: "marquee", start: p, cur: p, base };
                selected = new Set(base);
            }
            renderUI();
        });

        stage.addEventListener("pointermove", e => {
            lastPointer = { clientX: e.clientX, clientY: e.clientY };
            if (touches.has(e.pointerId)) touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (drag && drag.mode === "pinch") return pinchMove();
            if (drag && drag.mode === "wait") return;
            if (!drag) {
                if (tool === "select" && !spaceDown) {
                    const p = toWorld(e);
                    const overSel = selected.size && inside(p, bounds(selectedEls()));
                    updateCursor(hitTest(p) || overSel ? "move" : "default");
                }
                return;
            }
            const p = toWorld(e), v = board.viewport;

            if (drag.mode === "pan") {
                v.x = drag.vx + e.clientX - drag.cx;
                v.y = drag.vy + e.clientY - drag.cy;
                renderViewport();
                return;
            }
            if (drag.mode === "create") {
                const s = drag.start, el = drag.el;
                const q = snapPt(p);
                let w = q.x - s.x, h = q.y - s.y;
                if (e.shiftKey || el.type === "sticky") {
                    const m = Math.max(Math.abs(w), Math.abs(h));
                    w = Math.sign(w || 1) * m;
                    h = Math.sign(h || 1) * m;
                }
                Object.assign(el, { x: Math.min(s.x, s.x + w), y: Math.min(s.y, s.y + h), w: Math.abs(w), h: Math.abs(h) });
            } else if (drag.mode === "arrow") {
                const el = drag.el;
                drag.far = Math.max(drag.far, Math.hypot(e.clientX - drag.cx, e.clientY - drag.cy));
                const to = bindTarget(p, el.start && el.start.id);
                el.points[1] = to ? { ...p } : snapPt(p);
                el.end = to ? { id: to.id } : null;
                drag.bindId = to && to.id;
            } else if (drag.mode === "endpoint") {
                const el = drag.el, i = drag.i, other = i ? el.start : el.end;
                const to = bindTarget(p, other && other.id);
                const q = { x: drag.orig.x + p.x - drag.start.x, y: drag.orig.y + p.y - drag.start.y };
                el.points[i] = to ? q : snapPt(q);
                el[i ? "end" : "start"] = to ? { id: to.id } : null;
                drag.bindId = to && to.id;
                drag.changed = true;
            } else if (drag.mode === "pen") {
                const pts = drag.el.points, last = pts[pts.length - 1];
                if (Math.hypot(p.x - last.x, p.y - last.y) * v.scale >= 1.5) {
                    pts.push({ x: Math.round(p.x * 100) / 100, y: Math.round(p.y * 100) / 100 });
                    fitPoints(drag.el);
                }
            } else if (drag.mode === "move") {
                let dx = p.x - drag.start.x, dy = p.y - drag.start.y;
                // Snap the selection's top-left corner, keeping relative positions.
                if (snapOn) {
                    dx = snapV(drag.box.x + dx) - drag.box.x;
                    dy = snapV(drag.box.y + dy) - drag.box.y;
                }
                if (dx || dy) drag.changed = true;
                selectedEls().forEach(el => translateEl(el, drag.orig.get(el.id), dx, dy));
            } else if (drag.mode === "resize") {
                resizeTo(p, e.shiftKey);
            } else if (drag.mode === "marquee") {
                drag.cur = p;
                const m = marqueeBox();
                selected = new Set(drag.base);
                board.elements.forEach(el => {
                    if (el.x >= m.x && el.y >= m.y && el.x + el.w <= m.x + m.w && el.y + el.h <= m.y + m.h) selected.add(el.id);
                });
                renderUI();
                return;
            }
            renderElements();
            renderUI();
        });

        function resizeTo(p, keepRatio) {
            const B = drag.box, [hx, hy] = drag.handle;
            // Track the box corner by drag delta, so grabbing slightly off-corner doesn't jump.
            p = snapPt({ x: B.x + hx * B.w + p.x - drag.start.x, y: B.y + hy * B.h + p.y - drag.start.y });
            // Anchor is the point opposite the dragged handle; it stays fixed.
            const ax = B.x + (1 - hx) * B.w, ay = B.y + (1 - hy) * B.h;
            const denX = (2 * hx - 1) * B.w, denY = (2 * hy - 1) * B.h;
            let sx = hx === 0.5 || !denX ? 1 : (p.x - ax) / denX;
            let sy = hy === 0.5 || !denY ? 1 : (p.y - ay) / denY;
            if ((keepRatio || drag.uniform) && hx !== 0.5 && hy !== 0.5) {
                const s = Math.max(Math.abs(sx), Math.abs(sy));
                sx = Math.sign(sx || 1) * s;
                sy = Math.sign(sy || 1) * s;
            }
            drag.changed = true;
            selectedEls().forEach(el => {
                const o = drag.orig.get(el.id);
                if (el.points) {
                    el.points = o.points.map(q => ({ x: ax + (q.x - ax) * sx, y: ay + (q.y - ay) * sy }));
                    unbindUnselected(el);
                    fitPoints(el);
                    return;
                }
                const x1 = ax + (o.x - ax) * sx, x2 = ax + (o.x + o.w - ax) * sx;
                const y1 = ay + (o.y - ay) * sy, y2 = ay + (o.y + o.h - ay) * sy;
                el.x = Math.min(x1, x2);
                el.y = Math.min(y1, y2);
                if (el.type === "text") {
                    el.fontSize = Math.max(4, o.fontSize * Math.abs(hy === 0.5 ? sx : sy));
                    fitText(el);
                } else {
                    el.w = Math.max(1, Math.abs(x2 - x1));
                    el.h = Math.max(1, Math.abs(y2 - y1));
                }
            });
        }

        function endDrag() {
            if (!drag) return;
            const d = drag;
            drag = null;
            if (d.mode === "create") {
                const el = d.el, v = board.viewport;
                if (el.w * v.scale < 4 && el.h * v.scale < 4) {
                    const size = el.type === "rect" ? { w: 160, h: 100 } : el.type === "ellipse" ? { w: 120, h: 120 } : { w: 200, h: 200 };
                    Object.assign(el, { x: d.start.x - size.w / 2, y: d.start.y - size.h / 2 }, size);
                }
                pushUndo(d.before);
                setTool("select");
                renderElements();
                if (el.type === "sticky") startEdit(el, false);
            } else if (d.mode === "arrow") {
                if (d.far < 6) {
                    board.elements = board.elements.filter(el => el !== d.el);
                    selected.clear();
                } else {
                    pushUndo(d.before);
                    setTool("select");
                }
                renderElements();
            } else if (d.mode === "pen") {
                const el = d.el;
                el.points = simplify(el.points, 0.5 / board.viewport.scale);
                fitPoints(el);
                pushUndo(d.before);
                renderElements();
            } else if (d.changed) {
                pushUndo(d.before);
            }
            updateCursor();
            renderUI();
            scheduleSave();
        }

        // Undo whatever the current drag did (a second finger turns it into a pinch).
        function cancelDrag() {
            if (!drag) return;
            if (drag.before) setElements(drag.before);
            drag = null;
            renderAll();
        }

        function pinchState() {
            const [a, b] = [...touches.values()], r = stage.getBoundingClientRect();
            return { dist: Math.hypot(a.x - b.x, a.y - b.y) || 1, mid: { x: (a.x + b.x) / 2 - r.left, y: (a.y + b.y) / 2 - r.top } };
        }

        function startPinch() {
            cancelDrag();
            drag = { mode: "pinch", ...pinchState(), v: { ...board.viewport } };
        }

        // Keep the world point under the starting midpoint under the fingers.
        function pinchMove() {
            if (touches.size < 2) return;
            const { dist, mid } = pinchState(), v0 = drag.v, v = board.viewport;
            const scale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, v0.scale * dist / drag.dist));
            const wx = (drag.mid.x - v0.x) / v0.scale, wy = (drag.mid.y - v0.y) / v0.scale;
            Object.assign(v, { scale, x: mid.x - wx * scale, y: mid.y - wy * scale });
            renderViewport();
        }

        function onPointerUp(e) {
            const isTouch = touches.delete(e.pointerId);
            if (drag && (drag.mode === "pinch" || drag.mode === "wait")) {
                // Wait for every finger to lift before the next gesture.
                drag = touches.size ? { mode: "wait" } : null;
                lastTap = null;
                scheduleSave();
                return;
            }
            endDrag();
            if (isTouch && e.type === "pointerup") {
                lastTouchEnd = Date.now();
                const tap = tapStart && Math.hypot(e.clientX - tapStart.x, e.clientY - tapStart.y) < 10;
                if (tap && lastTap && lastTouchEnd - lastTap.t < 350 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 30) {
                    lastTap = null;
                    doubleClickAt(toWorld(e));
                } else {
                    lastTap = tap ? { t: lastTouchEnd, x: e.clientX, y: e.clientY } : null;
                }
            }
            // Focus inside the gesture so mobile keyboards open.
            if (editing && document.activeElement !== editor) editor.focus();
        }

        stage.addEventListener("pointerup", onPointerUp);
        stage.addEventListener("pointercancel", onPointerUp);

        function doubleClickAt(p) {
            if (tool !== "select") return;
            const hit = hitTest(p) || containerAt(p);
            if (!hit) createText(p);
            else if (EDITABLE.has(hit.type)) startEdit(hit, false);
        }

        stage.addEventListener("dblclick", e => {
            // Touch double-taps are handled in onPointerUp.
            if (Date.now() - lastTouchEnd < 600) return;
            doubleClickAt(toWorld(e));
        });

        stage.addEventListener("wheel", e => {
            e.preventDefault();
            const r = stage.getBoundingClientRect();
            const k = e.deltaMode === 1 ? 16 : 1;
            if (e.ctrlKey || e.metaKey) {
                const d = Math.max(-50, Math.min(50, e.deltaY * k));
                zoomAt({ x: e.clientX - r.left, y: e.clientY - r.top }, board.viewport.scale * Math.exp(-d * 0.01));
            } else {
                board.viewport.x -= e.deltaX * k;
                board.viewport.y -= e.deltaY * k;
                renderViewport();
                scheduleSave();
            }
        }, { passive: false });

        // Safari trackpad pinch.
        let gestureStart = null;
        stage.addEventListener("gesturestart", e => { e.preventDefault(); gestureStart = board.viewport.scale; });
        stage.addEventListener("gesturechange", e => {
            e.preventDefault();
            // iOS also fires these for touch pinches, which pinchMove already handles.
            if (touches.size) return;
            const r = stage.getBoundingClientRect();
            zoomAt({ x: e.clientX - r.left, y: e.clientY - r.top }, gestureStart * e.scale);
        });

        // ---------- keyboard ----------

        document.addEventListener("keydown", e => {
            if (isTyping(e)) return;
            const mod = e.metaKey || e.ctrlKey;
            const key = e.key.toLowerCase();
            if (e.key === " ") {
                spaceDown = true;
                updateCursor();
                e.preventDefault();
                return;
            }
            if (mod) {
                if (key === "z") e.shiftKey ? redo() : undo();
                else if (key === "y") redo();
                else if (key === "d") duplicateSelected();
                else if (e.code === "BracketRight") reorder(e.shiftKey ? "front" : "forward");
                else if (e.code === "BracketLeft") reorder(e.shiftKey ? "back" : "backward");
                else if (key === "a") { selected = new Set(board.elements.map(el => el.id)); renderUI(); }
                else if (key === "=" || key === "+") zoomBy(1.2);
                else if (key === "-") zoomBy(1 / 1.2);
                else if (key === "0") zoomAt(stageCenter(), 1);
                else return;
                e.preventDefault();
                return;
            }
            const step = snapOn ? GRID : e.shiftKey ? 10 : 1, dir = NUDGE_KEYS[e.key];
            const single = selected.size === 1 ? selectedEls()[0] : null;
            if (e.code === "Digit1" && e.shiftKey) zoomToFit();
            else if (e.key === "Delete" || e.key === "Backspace") deleteSelected();
            else if (e.key === "Escape") { exportMenu.hidden = true; selected.clear(); setTool("select"); }
            else if (e.key === "Enter" && single && EDITABLE.has(single.type)) startEdit(single, false);
            else if (dir) nudge(dir[0] * step, dir[1] * step);
            else if (TOOL_KEYS[key]) setTool(TOOL_KEYS[key]);
            else if (key === "i") imageInput.click();
            else if (key === "g") toggleSnap();
            else return;
            e.preventDefault();
        });

        document.addEventListener("keyup", e => {
            if (e.key === " ") { spaceDown = false; updateCursor(); }
        });
        window.addEventListener("blur", () => { spaceDown = false; updateCursor(); });

        // ---------- boards ----------

        function switchBoard(id) {
            commitEdit();
            flushSave();
            board = boards.find(b => b.id === id);
            selected.clear();
            undoStack = [];
            redoStack = [];
            drag = null;
            titleInput.value = board.title;
            renderAll();
            renderBoardList();
            if (db) tx("meta", "readwrite", s => s.put(id, "activeId")).catch(() => { });
        }

        function addBoard(b) {
            boards.push(b);
            switchBoard(b.id);
            saveBoard(b);
        }

        document.getElementById("new-board").onclick = () => {
            addBoard(newBoard());
            titleInput.focus();
            titleInput.select();
        };

        document.getElementById("delete-board").onclick = () => {
            if (!confirm(`Delete "${board.title || "Untitled"}"?`)) return;
            const index = boards.indexOf(board), id = board.id;
            boards.splice(index, 1);
            if (db) tx("boards", "readwrite", s => s.delete(id)).catch(() => { });
            // Nothing left to save for the deleted board.
            dirty = false;
            board = null;
            if (boards.length) switchBoard(boards[Math.max(0, index - 1)].id);
            else addBoard(newBoard());
        };

        titleInput.oninput = () => {
            board.title = titleInput.value;
            renderBoardList();
            scheduleSave();
        };

        document.querySelectorAll("[data-tool]").forEach(b => b.onclick = () => setTool(b.dataset.tool));
        document.getElementById("undo").onclick = undo;
        document.getElementById("redo").onclick = redo;
        document.getElementById("zoom-in").onclick = () => zoomBy(1.2);
        document.getElementById("zoom-out").onclick = () => zoomBy(1 / 1.2);
        document.getElementById("zoom-reset").onclick = () => zoomAt(stageCenter(), 1);
        document.getElementById("zoom-fit").onclick = zoomToFit;

        window.addEventListener("pagehide", flushSave);
        document.addEventListener("visibilitychange", () => { if (document.hidden) flushSave(); });

        // Drop image files no board refers to (from deleted images or boards). Files newer than a day are
        // kept, since another open tab may hold them in a board it hasn't saved yet.
        async function collectFiles() {
            const used = new Set(boards.flatMap(b => b.elements.filter(el => el.type === "image").map(el => el.fileId)));
            const files = await tx("files", "readonly", s => s.getAll());
            const unused = files.filter(f => !used.has(f.id) && Date.now() - (f.created || 0) > 864e5).map(f => f.id);
            if (unused.length) await tx("files", "readwrite", s => { unused.forEach(k => s.delete(k)); });
        }

        async function init() {
            let activeId = null;
            try {
                db = await openDB();
                boards = (await tx("boards", "readonly", s => s.getAll())) || [];
                activeId = await tx("meta", "readonly", s => s.get("activeId"));
                collectFiles().catch(() => { });
            } catch (e) {
                db = null;
                showNotice("Storage unavailable, changes won't be saved");
            }
            boards.sort((a, b) => a.created - b.created);
            boards.forEach(b => b.elements = sanitize(b.elements));
            const first = boards.find(b => b.id === activeId) || boards[0];
            if (first) switchBoard(first.id);
            else addBoard(newBoard());
            setTool("select");
        }

        init();
    </script>
</body>

</html>
